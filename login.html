<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro</title>
  <link rel="stylesheet" href="style/reset.css">
  <link rel="stylesheet" href="style/style.css">
</head>
<body>

  <header class="cabecalho">
        <div class="logo">
            <a href="./index.html" class=""><img src="./src/logo_ADAG.png" alt="ADAGlogo"></a>
        </div>
        <input type="text" placeholder="Clique para pesquiasar..." class="pesquisa">
        
        <div class="icones">
            <a href="#" class="perfil"><img src="./src/perfil.png" alt="perfil"></a>
            <a href="#" class="carrinho"><img src="./src/carrinho.png" alt="carrinho"></a>
        </div>

        <nav class="listatopo">
            <ul>
                <div class="botoes-superiores">
                    <div class="login">
                        <li><a href="./login.html">Login</a></li>
                    </div> 
                    <div class="cadastrese">  
                        <li><a href="./Cadastro.html">Cadastro</a></li>
                    </div>
                </div>    
            </ul>
            <ul class="lista-menu">
                <li><a href="./ajuste.html">Ajuste</a></li>
                <li><a href="./cloro.html">Cloro</a></li>
                <li><a href="./algicida.html">Algicida</a></li>
                <li><a href="./acessorios.html">Acessorios</a></li>
            </ul>
        </nav>

        </header>
  <div class="login-pagina">     
  <div class="topo">
  <img src="imagem/Barra_de_pesquisa.png" class="logo-topo">
  </div>

  <div class="fundo">

    <img src="src/fundo.png" class="onda" alt="onda">

    
    <div class="titulo">
      <h1>
        Bem-vindo(a) de volta 
      </h1>
      <h4>Ola! Se você ja comprou na loja da ADAG <br> antes, informe seu e-mail e senha</h4>
    </div>

    <div class="card">
      <form>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

        <button type="submit" class="btn">Continuar</button>

        <p class="ou">Ou</p>

        <button type="button" class="google">
          <img src="src/icons8-google-logo-48.png" alt="Google">
          Continuar com o Google
        </button>

      </form>
    </div>

  </div>
</div>
</body>
</html>
