<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro</title>
  <link rel="stylesheet" href="style/reset.css">
  <link rel="stylesheet" href="style/style.css"
</head>
<body>


  <div class="topo">
  <img src="imagem/Barra_de_pesquisa.png" class="logo-topo">
  </div>

  <div class="fundo">

    <img src="src/fundo.png" class="onda" alt="onda">

    
    <div class="titulo">
      <h1>
        Bem-vindo(a) de volta 
      </h1>
      <h4>Ola! Se você ja comprou na loja da ADAG <br> antes, informe seu e-mail e senha</h4>
    </div>

    <div class="card">
      <form>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

        <button type="submit" class="btn">Continuar</button>

        <p class="ou">Ou</p>

        <button type="button" class="google">
          <img src="src/icons8-google-logo-48.png" alt="Google">
          Continuar com o Google
        </button>

      </form>
    </div>

  </div>

</body>
</html>
