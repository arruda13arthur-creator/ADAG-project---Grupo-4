<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
 
  <div class="barra de pesquisa">
    <img src="imagem/Barra_de_pesquisa.png" class="barra de pesquisa" alt="barra Barra_de_pesquisa">
  </div>

  <div class="fundo">

    <img src="imagem/fundo.png" class="onda" alt="onda">

    
    <div class="titulo">
      <h2>
        Crie sua conta <br>
        mergulhe nessa experiência
      </h2>
    </div>

    <div class="card">
      <form>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone" placeholder="Digite seu telefone">

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

        <button type="submit" class="btn">Continuar</button>

        <p class="ou">Ou faça login com o Google</p>

        <button type="button" class="google">
          <img src="imagem/cont_google.png" alt="Google">
          Continuar com o Google
        </button>

      </form>
    </div>

  </div>

</body>
</html>
